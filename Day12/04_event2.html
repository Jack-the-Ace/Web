<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 이벤트 종류</title>
</head>
<body>

    <!-- 이벤트의 대표적인 종류들.. 다뤄보기 -->

    <!-- 1. input요소의 입력필드값 변경 이벤트 -->
    <input type="text" id="in1" onfocus="aaa()">
    <input type="text" id="in2" onblur="bbb()" onchange="ccc()">
    <script>
        function aaa(){
            document.querySelector('#in1').value='sam';
        }
        function bbb(){
            alert('blur');
        }
        function ccc(){
            alert('change....');
        }
    </script>
    <hr>
    <!-- onchange 가 활용되는 예제 : 사용자 입력이 완료되면 모두 대문자로 자동 변환 -->
    <input type="text" placeholder="아이디 입력" id="in3" onchange="ddd()">
    <script>
        function ddd(){
            // input 요소에 써있는 값(value)를 얻어오기
            var v=document.getElementById('in3').value;
            document.getElementById('in3').value=v.toUpperCase();
        }
    </script>
    <hr>

    <!-- 2. 마우스 이벤트 : over, out, move -->
    <div onmouseover="eee(this)" onmouseout="fff(this)" onmousemove="hhh(this)" style="width: 200px; height: 100px; background-color: yellow;"></div>
    <script>
        function eee(e){
            e.style.backgroundColor='lightgreen';
            e.style.border='2px solid red';
        }
        function fff(e){
            e.style.backgroundColor='yellow';
            e.style.border='';
        }
        var n=0;
        function hhh(e){
            n++;
            e.innerHTML=n;
        }        
    </script>
    <hr>

    <!-- 마우스의 좌표 확인 -->
    <div id="kk" style="width: 200px; height: 100px; background-color: aqua;"></div>
    <script>
        var div=document.querySelector('#kk');
        div.addEventListener('mousemove',function(event){  // event 정보를 가진 객체
            var s=`영역 안의 좌표: ${event.offsetX}, ${event.offsetY}<br>`;
            s +=`문서안의 좌표: ${event.clientX}, ${event.clientY}<br>`;
            s +=`모니터의 좌표: ${event.screenX}, ${event.screenY}<br>`;

            div.innerHTML=s;
        })
    </script>
    <hr>

    <!-- 마우스 버튼 다운 & 업 이벤트 -->
    <h4 class="tt">nice to meet you</h4>
    <script>
        var h4=document.querySelector('.tt');  //클래스 선택자

        h4.addEventListener('mousedown',function(){
            h4.style.backgroundColor='#FF0000';
            h4.style.color='#FFFF00';
            h4.style.fontSize='150%';
        })

        var up=function(){
             h4.style.backgroundColor='';
            h4.style.color='';
            h4.style.fontSize='100%';
        }
        h4.addEventListener('mouseup',up);
    
    </script>
    <hr>

    <!-- 3. 키보드 입력 이벤트 : keydown, keypress, keyup -->
    <hr>
    <input type="text" onkeydown="www()">
    <input type="text" onkeypress="rrr()">
    <script>
        function www(){
            // 누를 키보드의 키코드값을 window객체안에 있는 event 객체가 가지고있음.
            alert(window.event.keyCode);  // keydown은 대소문자 구분 안됨. 키보드의 특수키도 모두 번호가 존재함.
        }
        function rrr(){
            // keypress 는 아스키번호로 코드를 인식함. 대신, 방향키와 같은 특수키는 반응 안함.
            alert(window.event.keyCode);
        }
    </script>

    <hr>

    <!-- input 요소를 만들면 통상적으로 사용자 입력에 대한 검증과정을 구현함 -->
    <!-- 예) 비밀번호 규칙..(8자리 이상.. 대문자 포함..), 주민번호규칙에 어긋나는 입력, -->
    <!-- 이런 사용자 입력값에 대한 검증을 '유효성검사'라고 부름. 모든 웹사이트는 이 검사구현을 권고함. -->
    <!-- 이 검증을 if문으로 모두 처리하기에는 다소 번거로움 -->
    <!-- 특정 문자규칙을 따르는지를 검사하기 위한 규칙 만드는 문법 : 정규표현식 -->

    <hr>
    <h2>유효성 검사 - 정규표현식 사용(regular expression)</h2>

    <input type="text" id="in4">
    <button onclick="zzz()">유효성 검사</button>
    <script>
        function zzz(){
            // 검증용 정규표현식 만들기 (규칙 정하기)
            var regExp= /^[a-zA-Z]+$/  //영문자 한개 이상 요구...

            // 여러가지 정규표현 규칙을 연습해보기..
            regExp= /a/;   // a가 포함된 모든...
            regExp= /A/;   // A가 포함된 모든...
            regExp= /ab/;  // ab가 포함된 모든...
            regExp= /^a/;  // a로 시작하는 모든...
            regExp= /^[a-z]/;   // 영어소문자로 시작하는 모든...
            regExp= /a$/;  // a로 끝나는 모든...
            regExp= /ab$/;  // ab로 끝나는 모든...
            regExp= /^a$/;  // 오직 a 한 글자!...
            regExp= /^[a-z]$/;  // 오직 영어소문자 한글자!...
            regExp= /^[a-zA-Z]$/;  // 오직 영어 한글자!...
            regExp= /^[a-zA-Z0-9]$/;  // 오직 영어 or 숫자 한글자!...
            regExp= /^[a-z]{2}$/;  // 오직 영어소문자 2글자!...
            regExp= /^[a-z]{2,4}$/;  // 오직 영어소문자 2~4글자!...
            regExp= /^[a-z]{4,}$/;  // 영어소문자 4글자 이상...
            regExp= /^\w{4,}$/;  // 문자 or 숫자 4글자 이상...
            regExp= /^[a-z]*$/;  // 영어소문자 0개 이상...(값이 없어도 OK)
            regExp= /^[a-z]?$/;  // 영어소문자 0개 또는 1개...(값이 없어도 OK)
            regExp= /^[a-z]+$/;  // 영어소문자 1개 이상...
            regExp= /^\d$/;  // 숫자 1개...
            regExp= /^\d\d\d$/;  // 숫자 3개...
            regExp= /^\d{3,4}$/;  // 숫자 3~4개...
            regExp= /^\d\d\d\d-\d\d-\d\d$/;  // 숫자 패턴 만들기...
            regExp= /^[a-zA-Z0-9]+@[a-z]+.[a-z]+$/;  // 이메일 패턴 ###@##.##
            regExp= /^http/;  // URL 주소를 올바르게 입력하도록 요구...


            // 사용자가 input 요소에 입력한 글씨가 위 규칙에 맞는지 검사
            var in4=document.getElementById('in4');
            if(regExp.test(in4.value)){
                alert('OK')
            }else{
                alert('요구하는 형식에 맞지 않아요~~');
            }

        }
    </script>

</body>
</html>
