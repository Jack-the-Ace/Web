<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS BOM</title>
</head>
<body>

    <!-- BOM : 브라우저를 관리하는 내장된 JS 객체들 -->
    
    <!-- 1. window : 최상위 객체(브라우저 창 전체를 관리) -->

    <!-- 주요 기능들 -->
    <!-- 1) open(), close() : 새로운 웹문서 열기/닫기 -->
    <button onclick="aaa()">naver</button>
    <script>
        function aaa(){
            //window.open('https://www.naver.com');  // 기본 새탭으로 열림 [target="_blank"]
            //window.open('https://www.naver.com','_self');

            // 세번째 파라미터로 옵션을 추가하면.. 새 창으로 웹문서를 열 수 있음.
            var option='width=500, height=200, left=200, top=150'
            window.open('https://www.naver.com','_blank',option);
        }
    </script>

    <hr>
    <button onclick="bbb()">메세지 윈도우창 띄우기</button>
    <button onclick="ccc()">메시지 윈도우창 닫기</button>
    <script>
        var win=undefined;
        function bbb(){

            win=window.open('','','width=500,height=200,left=150,top=100');
            // 새 창의 제어는 win 객체가 처리..
            win.document.write('<h2>Hello new window</h2>');
        }
        function ccc(){
            win.close();
        }
    </script>
    
    <hr>
    <!-- 윈도우 창 이동시키기 -->
    <button onclick="eee()">open window</button>
    <button onclick="fff()">move window</button>
    <script>
        var win;
        function eee(){
            win=window.open('','','width=400, height=200');
            win.document.write('오늘의 특가 세일 제품!');
            
            // 특정 위치로 이동
            win.moveTo(300,100); // x축, y축
        }
        function fff(){
            //현재 위치 기준으로 조금씩 이동..
            win.moveBy(10,20);  // x축, y축
            //움직였을때 브라우저 창이 앞으로 보이게...
            win.focus();
        }
    </script>

    <hr>

    <!-- 일정시간 후에 특정 함수가 실행되도록.. setTimeout, setInterval, clearInterval -->
    <button onclick="ggg()">3초 후에 경고창 띄우기</button>
    <script>
        function showAlert(){
            alert('3초 경과!!!');
        }

        function ggg(){
            // 3초 후에 showAlert 이라는 이름의 함수를 실행해라!!!
            window.setTimeout(showAlert,3000);  // 3,000ms ---> 3s
        }
    </script>
    <br>

    <h3 id="hh">0</h3>
    <button onclick="hhh()">1초 마다 카운트 증가 시작!!!</button>
    <button onclick="iii()">카운트 멈추기</button>
    <script>
        function showCount(){
            // h3 요소에 써있는 숫자에 1 더하기
            var h3=document.querySelector('#hh');
            //h3.innerHTML=h3.innerHTML+1;
            h3.innerHTML=parseInt(h3.innerHTML)+1;
        }

        var interval_id;

        function hhh(){
            // 1초 마다.. showCount라는 이름의 함수를 실행
            interval_id=window.setInterval(showCount,1000);
        }
        function iii(){
            window.clearInterval(interval_id);
        }
    </script>
    <hr>
    <!-- 기타 유용한 메소드들 -->
    <script>
        // 웹브라우저의 인터넷 주소창의 URL은 기본적으로 한글이나 띄어쓰기 같은 문자는 사용못함.
        // 그래서 만약 한글이나 띄어쓰기 또는 특수문자 중 일부를 사용하고 싶다면..
        // URL에서 인식가능한 문자로 변환해야 함... 이를 url encoding(암호화) 이라고 함.

        // 인코딩을 해주는 기능을 window 최상위객체가 가지고 있음
        // 최상위 객체 window 키워드는 생략해도 됨.
        //var a=window.encodeURI('http://www.aaa.com/가나다 마바사.html');  // 파일명이 한글과 띄어쓰기
        var a=encodeURI('http://www.aaa.com/가나다 마바사.html');
        document.write('인코딩된 URL: ',a,'<br>');

        // 반대로 인코딩된 URL을 해독(decode)해주는 기능도 있음.
        var b=decodeURI(a);
        document.write('디코딩된 URL: ',b,'<hr>');

        // eval() - 문자열 데이터를 JS코드인것처럼 해독하여 실행해주는 기능
        var x=10+2*6;
        document.write(x,'<br>');

        var x='10+2*6';
        document.write(x,'<br>');

        var x=eval('10+2*6');
        document.write(x,'<br>');

        // 숫자로 변환이 가능한 모양이 아닌지 확인해주는 기능 [parseInt() 하기전에 확인용도]
        document.write(window.isNaN(10)+'<br>');  // false
        document.write(window.isNaN('10')+'<br>');  // false
        document.write(window.isNaN('hello')+'<br>');  // true

        // 내장함수인줄 알고 사용했던 모든 기능들은 사실.. window의 멤버함수임.
        // window.alert();
        // window.prompt();
</script>
<hr>

<!-- window 최상위 객체의 멤버변수들.. 중 주요한 객체들.. 소개 -->
<!-- 2. document : 웹문서를 관리하는 여러기능을 가진 객체 -->
<script>
    //원래는 window의 멤버이기에...
    window.document.write('이게 원래.. 코드 문법.<br>');
</script>
<hr>

<!-- 3. screen : 모니터 사이즈 -->
<script>
    // 모니터의 해상도 정보..
    document.write('모니터 해상도: '+screen.width+" * "+screen.height+'<br>');
    document.write('작업표시줄 제외한 해상도: '+screen.availWidth+" * "+screen.availHeight+'<br>');

    // 웹브라우저 창의 해상도는 window 객체가 가지고 있는 정보
    document.write('브라우저 창 크기: '+window.outerWidth+" * "+window.outerHeight+'<br>');
    document.write('브라우저 창 크기: '+window.innerWidth+" * "+window.innerHeight+'<br>');
</script>
<hr>

<!-- 버튼으로 전체화면으로 확대할때.. 활용 -->
<button onclick="jjj()">전체화면 윈도우</button>
<script>
    function jjj(){
        var option='width='+screen.availWidth+', height='+screen.availHeight;
        open('','',option);
    }    
</script>

<hr>

<!-- 4. location : URL 정보 관리 객체 -->
<script>
    //location 객체의 주요 멤버변수 (속성)
    document.write(location.href,'<br>');
    document.write(location.protocol,'<br>');
    document.write(location.pathname,'<br>');
</script>

<!-- location 객체의 주요 기능함수들 -->
<button onclick="mmm()">새로운 문서 열기</button>
<button onclick="kkk()">새로운 문서로 대체하여 열기</button>
<button onclick="nnn()">새로운 문서 다시 열기(새로고침)</button>
<script>
    function mmm(){
        location.assign('https://www.naver.com');  // 뒤로가기 버튼 활성화
        // yrl 를 바꾸는 것이기에.. 함수대힌 속성값을 변경해도 됨

    }
    function kkk(){
        location.replace('https://www.naver.com');  // 기존 문서가 없어짐. 증, 뒤로가기 없음
    }
    function nnn(){
        location.reload('https://www.naver.com');
    }
</script>

<hr>

<!-- 5. history : 방문한 URL 정보를 가지고 있음. -->
<script>
    document.write('방문한 페이지 수: '+history.length+'<br>');
</script>

<button onclick="history.back()">뒤로</button>
<button onclick="history.forward()">앞으로</button>
<button onclick="history.go(-2)">2칸 뒤</button>

<hr>

<!-- 6. navigator : 브라우저의 정보관리 객체 : 나중에 새로운 기능들이 이 객체의 하위멤버로 추가됨 (ex. 위치기반서비스, 웹캠) -->
<script>
    document.write(navigator.appCodeName,'<br>');
    document.write(navigator.appName,'<br>');
    document.write(navigator.appVersion,'<br>');
    document.write(navigator.platform,'<br>');  //사용자가 접속하는 환경을 파악할 수 있음.. 대응이 가능.
    document.write(navigator.userAgent,'<br>');
</script>


    
</body>
</html>
