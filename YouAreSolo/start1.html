<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>너는솔로 - 시작하기</title>
    <link rel="stylesheet" href="./css/start1.css">
    <style>
        /* 기본 모바일 레이아웃 및 배경 테마 통일 */
        body {
            background-color: #f4f8fa;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #2c3e50; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* 스마트폰 화면 크기에 맞춘 세로형 래퍼 */
        #wrap {
            max-width: 450px; width: 100%; height: 100vh; 
            padding: 20px; box-sizing: border-box;
            background: #ffffff; border: 1px solid #e1eef6;
            box-shadow: 0 8px 24px rgba(163, 197, 222, 0.2);
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }

        /* [요소1] 로고 영역 (비율 2) */
        #logo {flex: 2;  display: flex;  align-items: center;  justify-content: center;}
        #logo img {max-height: 70px;  width: auto;  object-fit: contain;}
        /* 구분선 그라데이션 */
        hr{border: 0; height: 1px; width: 100%; margin: 0;background: linear-gradient(to right, transparent, #bedaf3, transparent);}

        /* [요소2] 이미지 컨테이너 영역 (비율 7 - 내부 스크롤 가능) */
        .image_section {
            flex: 7; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            overflow-y: auto; padding: 10px 0; box-sizing: border-box;
            /* 스크롤바 숨기기 브라우저별 설정 */
            -ms-overflow-style: none; scrollbar-width: none; 
        }
        .image_section::-webkit-scrollbar { display: none; } /* 크롬 스크롤바 숨김 */

        /* 추후 수정 예정인 사진 가이드 영역 3개 */
        .photo_placeholder {
            width: 90%; min-height: 160px; /* 세로 배치 시 적절한 임시 크기 */
            border: 1px dotted #2c3e50; border-radius: 16px;
            display: flex; justify-content: center; align-items: center;
            color: #7f8c8d; font-size: 0.9rem; background-color: #fafbfc;
        }

        /* [요소3] 화살표 버튼 영역 (비율 2) */
        .next_section {
            flex: 2; width: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        /* CSS로 만든 크고 두꺼운 오른쪽 화살표(→) */
        .arrow_btn {
            display: flex; /* 내부 글씨와 화살표 정렬을 위해 flex로 변경 */
            align-items: center;
            justify-content: center;
            gap: 8px; /* 글씨와 화살표(→) 사이의 간격 */
            width: 85%; /* 둥근 원에서 가로로 긴 바 형태로 늘림 */
            height: 54px;
            background: linear-gradient(135deg, #9dd1f7 0%, #72b3e6 100%);
            border-radius: 27px; /* 타원형 모양으로 이쁘게 라운딩 처리 */
            position: relative; cursor: pointer;
            box-shadow: 0 6px 15px rgba(114, 175, 222, 0.4);
            transition: transform 0.2s ease;
            
            /* 💡 요청하신 연한 하늘색 글씨 스타일 추가 */
            color: #eaf6ff; 
            font-size: 1.05rem;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(72, 140, 190, 0.3); /* 글씨 가독성을 위한 은은한 그림자 */
            
            /* 둥둥 떠있는 무한 애니메이션 작동 */
            animation: floating 2s ease-in-out infinite;
        }

        /* 화살표 모양 생성 부모 안의 가상 요소 (오른쪽으로 정렬) */
        .arrow_btn::before {
            content: ''; 
            display: inline-block;
            width: 10px; height: 10px; /* 길어진 버튼 크기에 맞춰 앙증맞게 조절 */
            border-top: 3px solid #eaf6ff; /* 화살표 선도 연한 하늘색으로 통일 */
            border-right: 3px solid #eaf6ff;
            transform: rotate(45deg);
            margin-top: -1px; /* 미세한 수직 중심 맞춤 */
        }

        /* 둥둥 떠있는 효과를 위한 애니메이션 keyframes 정의 */
        @keyframes floating {
            0% { transform: translateY(0); box-shadow: 0 6px 15px rgba(114, 175, 222, 0.4); }
            50% { transform: translateY(-8px); box-shadow: 0 14px 20px rgba(114, 175, 222, 0.25); }
            100% { transform: translateY(0); box-shadow: 0 6px 15px rgba(114, 175, 222, 0.4); }
        }

        /* 화살표 클릭 효과 */
        .arrow_btn:active {
            animation: none; transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="wrap">
    <div id="logo"><img src="./boys/thumbs-up.png" alt="temporary picture"></div>
    <hr>
    

    <div class="image_section">
        <div class="ani-text line1">혹시...</div>    
        <div class="ani-text line2">아직....</div>    
        <div>
            <span class="ani-text line3-1">너는....&nbsp;</span>
            <span class="ani-text line3-2">솔로???</span>
        </div>
        <div class="photo_placeholder">애니메이션 사진 영역 2</div>
        <div class="photo_placeholder">애니메이션 사진 영역 3</div>
    </div>

    <div class="next_section">
        <div class="arrow_btn" onclick="location.href='./start2.html'" title="시작하기">솔로나라로 입장하기!</div>
    </div>
</div>

</body>
</html>
