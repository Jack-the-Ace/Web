<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영숙 선택!</title>
    <link rel="stylesheet" href="./css/choiceL.css">
    <script src="./js/choiceR.js"></script>
    <style>
        #logo {flex: 2;  display: flex;  align-items: center;  justify-content: center;}
        #logo img {max-height: 140px;  width: auto;  object-fit: contain;}        
        body {
            background-color: #d9edf7;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #2c3e50; margin: 0; padding: 0;
        }
        h3 {
            text-align: center; font-size: 1.4rem; font-weight: 700;
            color: #3a8bcd; margin: 25px 0 10px 0; letter-spacing: -0.5px;
        }
        hr {margin-bottom: 20px; border: 0; height: 1px; 
            background: linear-gradient(to right, transparent, #bedaf3, transparent);}
        #wrap {
            grid-template-columns: 0.5fr 3.2fr 0.5fr; grid-gap: 12px; background-color: #d9edf7;
            max-width: 450px; width: 100%; height: auto; margin: 0 auto; padding: 0 16px 40px 16px; box-sizing: border-box;            
        }
        header, nav, main, aside, footer {
            background: #f4f9fc; border: 1px solid #e1eef6; border-radius: 16px; box-shadow: 0 4px 12px rgba(163, 197, 222, 0.15);
            padding: 15px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 600;
            color: #5b7e96; transition: all 0.3s ease;
        }
        header:hover, nav:hover, main:hover, aside:hover, footer:hover {
            transform: translateY(-2px); box-shadow: 0 6px 16px rgba(114, 175, 222, 0.25); border-color: #bad3eb;
        }
        header {
            background: linear-gradient(135deg, #9dd1f7 0%, #72b3e6 100%); color: #f4f9fc;
            font-size: 1.3rem; font-weight: 700; padding: 25px 15px; border: none;   border-radius: 20px; 
        }
        header p { margin: 0; }
        nav, aside {min-height: 220px; background-color: #f9fbfd;}
        main {display: flex; justify-content: center; gap: 8px; padding: 10px; background-color: #f4f9fc;}
        main img {
            width: 70%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 12px; border: 1px solid #f0f6fa;
        }
        footer {
            grid-area: ee;  background-color: #ebf3f9; color: #8faabf; font-size: 0.8rem; font-weight: 400; padding: 12px;
            border: none;
        }
        .like_btn_container {width: 100%; display: flex; justify-content: center; align-items: center; margin: 15px 0 10px 0;}
        #like {
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 85%; height: 56px;
            background: linear-gradient(135deg, #ffaec9 0%, #ff779d 100%); border-radius: 28px; border: none;
            position: relative; cursor: pointer; box-shadow: 0 6px 15px rgba(255, 119, 157, 0.4);
            transition: transform 0.2s ease; text-shadow: 0 1px 2px rgba(190, 48, 87, 0.3);
            color: #fff0f3; font-size: 1.1rem; font-weight: 700; outline: none;
            animation: floating 2s ease-in-out infinite;
        }
        #like::before {
            content: '♥'; display: inline-block; font-size: 1.3rem; color: #fff0f3; margin-top: -2px;
        }
        #like:active { animation: none; transform: scale(0.95); }

        @keyframes floating {
            0% { transform: translateY(0); box-shadow: 0 6px 15px rgba(255, 119, 157, 0.4); }
            50% { transform: translateY(-8px); box-shadow: 0 14px 20px rgba(255, 119, 157, 0.25); }
            100% { transform: translateY(0); box-shadow: 0 6px 15px rgba(255, 119, 157, 0.4); }
        }
    </style>
</head>
<body>
    <div id="logo"><img src="./boys/logo.png" alt="logo"></div>    
    <hr>    
    <div id="wrap">
        <header><p>별점을 입력하세요!</p></header>
        <main>
            <img src="https://jack.dothome.co.kr/UAS/boys/JeongSuk1.png" alt="JeongSuk1">
            <hr>
            <p class="profile_info">
                <span class="nickname">정숙</span>
                <span class="height">172cm</span>
                <span class="job">회계사</span>
            </p>
            <hr>
            <p class="profile_text">
                안녕하세요! :)<br> 30세 회계사 정숙입니다!<br>잘 부탁드려요 ㅎㅎ <br>
                바쁘게 살다보니 솔로 기간이 좀 길었지만 이젠 시간이 많이 여유로워져서 자주 만나는 것도 가능합니다!ㅎㅎ<br>
                저는 딱히 조건 같은건 안보구요, 대화가 잘 통하고 웃음코드가 잘 맞는게 중요하다고 생각합니다!<br>
                다들 새해 복 많이 받으세요~!! >_< ㅎㅎ
            </p>
            <div id="star">
                <div class="star_rating">
                    <span class="star" data-value="1">☆</span>
                    <span class="star" data-value="2">☆</span>
                    <span class="star" data-value="3">☆</span>
                    <span class="star" data-value="4">☆</span>
                    <span class="star" data-value="5">☆</span>
                </div>
                <button type="button" id="submit_star" disabled>제출</button>
            </div>
            <div class="reply">
                <textarea name="reply" id="reply_text" placeholder="매너있는 댓글 부탁드립니다! :)"></textarea>
                <button type="button" id="submit_reply">제출</button>
            </div>      
        </main>
        <hr>
        <h6>좋아요를 보내시겠어요? (200하트 소모)</h6>
        <div class="like_btn_container">
            <button id="like" onclick="goLikePage()">좋아요!♡</button>
        </div>
        <script>
        function goLikePage() {
            const nickname = document.querySelector('.profile_info .nickname').innerText.trim();
            location.href = "https://jack.dothome.co.kr/UAS/like.html?name=" + encodeURIComponent(nickname);
        }
        </script>
        <hr>
        <footer>
            <a href="javascript:history.back();" class="back-btn">← 뒤로가기</a>
            <span>information</span>
        </footer>
    </div>    
</body>
</html>
