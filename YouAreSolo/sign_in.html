<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 너는솔로</title>
    <style>
        body {
            background-color: #f4f8fa;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #2c3e50; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        #wrap {
            max-width: 450px; width: 100%; padding: 30px 20px; box-sizing: border-box;
            background: #ffffff; border: 1px solid #e1eef6; border-radius: 24px;
            box-shadow: 0 8px 24px rgba(163, 197, 222, 0.2);
        }
        h2 { text-align: center; color: #3a8bcd; margin-bottom: 25px; }
        
        /* 입력 폼 스타일링 */
        .input_group { margin-bottom: 18px; }
        .input_group label { display: block; font-weight: 600; margin-bottom: 6px; color: #5b7e96; font-size: 0.9rem; }
        .input_group input, .input_group select {
            width: 100%; height: 48px; border: 1px solid #bedaf3; border-radius: 12px;
            padding: 0 14px; box-sizing: border-box; font-size: 1rem; color: #2c3e50; outline: none;
        }
        .input_group input:focus { border-color: #72b3e6; box-shadow: 0 0 0 3px rgba(114, 175, 222, 0.15); }
        .input_group input[type="file"]{padding-top: 10px;}
        /* 가입 버튼 */
        #submit_btn {
            width: 100%; height: 56px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #9dd1f7 0%, #72b3e6 100%);
            color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer;
            margin-top: 15px; box-shadow: 0 4px 12px rgba(114, 175, 222, 0.2);
        }
    </style>
</head>
<body>

<div id="wrap">
    <h2>솔로나라 입성하기</h2>
    <form action="./sign_in.php" method="POST" enctype="multipart/form-data" id="reg_form">
        <div class="input_group">
            <label for="userid">아이디</label>
            <input type="text" id="userid" name="userid" placeholder="사용할 아이디 입력" required>
        </div>
        <div class="input_group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
        </div>
        <div class="input_group">
            <label for="name">이름 (닉네임)</label>
            <input type="text" id="name" name="name" placeholder="예: 영숙, 영철, 영호 등" required>
        </div>
        <div class="input_group">
            <label for="gender">성별</label>
            <select id="gender" name="gender" required>
                <option value="">성별을 선택하세요</option>
                <option value="M">남성</option>
                <option value="W">여성</option>
            </select>
        </div>
        <div class="input_group">
            <label for="profile_img">프로필 사진은 필수입니다!</label>
            <input type="file" id="profile_img" name="profile_img" accept="image/*">
        </div>
        <button type="submit" id="submit_btn">가입 신청 완료</button>
    </form>
</div>
<script>
    const useridInput = document.getElementById('userid');
    const regForm = document.getElementById('reg_form');
    let isIdValid = false; // 아이디 중복 통과 여부를 기억하는 변수

    // 아이디 입력칸에 무언가를 입력하고 칸을 벗어났을 때 작동
    useridInput.addEventListener('change', function() {
        const userid = this.value.trim();
        
        if(userid === "") {
            isIdValid = false;
            return;
        }

        // FormData 객체를 생성해 서버로 아이디 전달
        const formData = new FormData();
        formData.append('userid', userid);

        // 비동기 통신(Fetch)으로 check_id.php에 확인 요청
        fetch('./check_id.php', {method: 'POST', body: formData})
        .then(response => response.json())
        .then(data => {
            if(data.exists) {
                // 💡 중복된 아이디일 경우 동작 수행
                alert("기존에 존재하는 아이디 입니다. 다른 아이디로 입력해주세요.");
                useridInput.value = ""; // 적었던 것 지우기
                useridInput.focus();   // 다시 커서가 깜빡이도록 포커스 주기
                isIdValid = false;     // 중복되었으므로 검증 실패 상태 유지
            } else {
                // 사용 가능한 아이디일 경우
                isIdValid = true;
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });
    // [가입신청완료] 버튼을 눌러 폼을 제출하려고 할 때 최종 제어
    regForm.addEventListener('submit', function(event) {
    const profileImgInput = document.getElementById('profile_img');

    // 💡 1. 프로필 사진 첨부 여부 검사 추가
    if (!profileImgInput.value) {
        event.preventDefault(); // 다음 단계(서브밋) 진행 차단
        alert("프로필 사진은 필수입니다! 본인 사진을 첨부해 주세요.");
        profileImgInput.focus();
        return; // 아래 아이디 체크로 안 넘어가고 여기서 중단
    }

    // 2. 기존 아이디 중복 체크 통과 여부 검사
    if (!isIdValid) {
        event.preventDefault(); // 다음 단계(서브밋) 진행 차단
        alert("아이디 중복 여부를 다시 확인해 주세요.");
        useridInput.focus();
    }
});
</script>
</body>
</html>
