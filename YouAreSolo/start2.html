<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 하세요!</title>
    <style>
        body {
            background-color: #f4f9fc; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #2c3e50; margin: 0; padding: 0;   display: flex; justify-content: center; align-items: center;  min-height: 100vh;
        }
        #wrap {
            max-width: 450px;  width: 100%;  height: 92vh;  margin: 0 auto;  padding: 24px 20px;  background: #d9edf7; 
            border: 1px solid #e1eef6;  border-radius: 24px; box-shadow: 0 8px 24px rgba(163, 197, 222, 0.2);
            box-sizing: border-box; display: flex;  flex-direction: column;
        }
        #logo {flex: 2;  display: flex;  align-items: center;  justify-content: center;}
        #logo img { max-height: 140px; width: auto;  object-fit: contain;}
        hr{border: 0; height: 1px; width: 100%; margin: 0;background: linear-gradient(to right, transparent, #bedaf3, transparent);}
        #gif {flex: 4;  display: flex; align-items: center; justify-content: center; padding: 20px 0;}
        #gif img {
            width: 90%; height: 100%; object-fit: cover; 
            border-radius: 16px; border: 1px solid #f0f6fa; background-color: #f9fbfd;
        }
        #btn_area{flex: 4;  width: 100%;  display: flex;  align-items: center; justify-content: space-between; gap: 12px;}
        #btn_area a {flex: 1; 
            height: 56px;  border: none;  border-radius: 14px;  font-size: 1rem;  font-weight: 700;
            cursor: pointer;  transition: all 0.25s ease;  box-shadow: 0 4px 12px rgba(114, 175, 222, 0.15);
            display: flex;  align-items: center;  justify-content: center; text-decoration: none;
        }
        #sign_in {background-color: #ebf3f9;  color: #5b7e96;}
        #sign_in:hover{background-color: #e1eef6;  transform: translateY(-2px);}
        #log_in{background: linear-gradient(135deg, #9dd1f7 0%, #72b3e6 100%);  color: #ffffff;}
        #log_in:hover{box-shadow: 0 6px 16px rgba(114, 175, 222, 0.3); transform: translateY(-2px);}
    </style>
</head>
<body>
    <div id="wrap">
        <div id="logo"><img src="./boys/logo.png" alt="logo"></div>
        <hr>
        <div id="gif">
            <img src="./boys/couple3.png" alt="커플사진_와인">
        </div>
        <br>
        <div id="btn_area">
            <a href="http://jack.dothome.co.kr/UAS/sign_in.html" id="sign_in">회원가입</a>
            <a href="http://jack.dothome.co.kr/UAS/log_in.html" id="log_in">로그인</a>
        </div>
    </div>
</body>
</html>
