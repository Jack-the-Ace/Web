<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>layout css property</title>

        <style>
            /* display 속성 실습 */
            #aa{display: inline; width: 300px;}
            #aa{display: inline-block; width: 150px;}

            img{display: block;}
            #kk{display: none;}

        </style>
    </head>
    <body>

        <!-- display 속성 연습 -->
        <p id="aa">Hello world!</p>
        <a href="">Good Day</a>
        <strong>good morning!</strong>

        <img src="./image/border.png" alt="image">
        <hr>

        <ul>
            <li>aaa</li>
            <li id="kk">bbb</li>
            <li>ccc</li>
        </ul>

        <hr>

        <!-- 블럭요소와 인라인요소를 혼합하여 사용할때 고려할 것 들.. -->

        <!-- 블럭요소 안에 인라인요소를 넣을 수 있음. -->
        <div style="background-color: tomato; border: solid; padding: 5px;">
            Nice <em>aaaa</em> World
        </div>

        <!-- 인라인요소 안에 블럭요소는 넣으면 안됨. 에러는 아닌데.. 이상해짐 -->
        <span style="background-color: teal; border: solid; padding: 5px;">
            Nice <p>aaaa</p> World
        </span>

        <!-- 블럭안에 다른 블럭요소를 넣을 수 있음. -->
        <div style="background-color: azure; border: solid; padding: 5px;">
            Nice <p>aaaa</p> World
        </div>

        <!-- 블럭안에 같은 블럭요소를 넣으면... 조심... -->
        <p style="background-color: aqua; border: solid; padding: 5px;">
            Nice <p>aaaa</p> World
        </p>
        <h2 style="background-color: aqua; border: solid; padding: 5px;">
            Nice <h2>aaaa</h2> World
        </h2>

        <!-- div블럭요소안에 div블럭요소가 존재하는 것은 허용됨 -->
        <div style="background-color: bisque; border: solid; padding: 5px;">
            Nice <div>aaaa</div> World
        </div>

        <hr>
        
        <!-- position 속성 & 위치지정속성(left, right, top, bottom) -->
        <div class="region">
            <p id="p1">black #1</p>
            <p id="p2">black #2</p>
            <p id="p3">black #3</p>
        </div>

        <style>
            .region{
                background-color: black;
                position: relative;
            }

            #p1{
                background-color: aqua;
                width: 200px;
                height: 50px;
            }
            #p2{
                position: static;  /* 정적위치 - default : 원래 놓여져야 할 위치에 놓여짐(겹치지 않음) */
                position: relative; /* 상대위치 - 원래 놓여질 위치에서 위치지정 속성값을 반영함 */
                position: absolute; /* 절대위치 - 웹문서의 좌상단을 기준으로 배치 (위치지정 속성이 없으면 그려지지 않음) */
                /* 절대위치를 사용할때 부모요소의 position이 static이 아니면.. 부토요소의 좌상단을 기준으로 함 */
                position: fixed;  /* 고정위치 - 웹 브라우저 창을 기준으로 배치 */

                /* 위치 지정 속성(position:static 에서는 무시됨) */
                /* left: 50px;
                top: 30px; */
                right: 10px;
                bottom: 20px;


                background-color: yellow;
                width: 150px;
                height: 50px;
            }
            #p3{
                background-color: lightgreen;
                width: 200px;
                height: 50px;
            }
        </style>

    </body>
</html>
