<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Game</title>

    <script>
        // 전역변수로서 이미지객체 준비
        var imgPlayer=new Image();
        imgPlayer.src='./image/ms_01.png';

        // 플레이어가 표시될 이미지의 중심 좌표 변수
        var x=200, y=250;
        // 플레이어의 사이즈를 동적으로 변경할 수도 있으니..
        // 이미지의 절반 너비와 높이값 저장
        var w=40, h=40;

        //플레이어의 이동 방향과 속도 변수
        var dx=1;
        var dy=1;

        // 배경 이미지 준비
        var imgBg=new Image();
        imgBg.src='./image/bg.png';

        // 배경 이미지의 좌상단 좌표
        var bx=0, by=0;

        //그림도구와 캔버스를 전역변수로 준비
        var canvas;
        var context;

        // 이미지를 그려내는 작업은.. body 영역의 로딩이 완료된 후 진행
        function loaded(){
            canvas= document.getElementById('c1');
            context=canvas.getContext('2d');

            //게임을 진행하는 기능함수 호출
            runGame();
            // 10ms 마다 runGame()함수를 다시 호출
            setInterval(runGame,10);
        }//-------------------------------------------------------------

        function runGame(){
            moveAll();  // 움직이기..
            drawAll();  // 이미지 그리기            
        }//-----------------------------------------------------------------------------------

        function moveAll(){
            //배경이미지 이동(왼쪽으로...)
            bx+=-1;
            if(bx<=-400) bx=0;

            //플레이어의 위치를 이동
            x+=dx;
            y+=dy;

            // 벽에 닿으면.. 반대방향으로...
            if(x<w||x>400-w) dx=-dx;
            if(y<h||y>500-h) dy=-dy;

        }//------------------------------------------------------------

        function drawAll(){
            //배경 이미지 그리기 (배경먼저그려야함)
            context.drawImage(imgBg,bx,by,400,500); //canvas 사이즈
            context.drawImage(imgBg,bx+400,by,400,500);
            //플레이어 이미지 그려내기
            context.drawImage(imgPlayer, x-w, y-h, w*2, h*2);

        }//-----------------------------------------------------------------

        function down(){
            keyCode=window.event.keyCode;
            switch(keyCode){
                case 37: dx=-4; break;  // LEFT
                case 38: dy=-4; break;  // UP
                case 39: dx= 4; break;  // RIGHT
                case 40: dy= 4; break;  // DOWN

                default: dx=1; dy=1;  //AUTO
            }

        }//----------------------------------------------------------------

        function up(){
            keyCode=window.event.keyCode;
            // 방향키를 놓으면.. 멈추도록..
            if(keyCode>=37 && keyCode<=40){
                dx=0; dy=0;
            }

        }//-------------------------------------------------------------------
    </script>
</head>
<body onload="loaded()" onkeydown="down()" onkeyup="up()">

    <canvas id="c1" width="400" height="500" style="border: 2px solid black;"></canvas>

    
</body>
</html>
