<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS File Reader</title>
</head>
<body>
    
    <h2>텍스트 파일 데이터 읽기</h2>
    <input type="file" id="in1">
    <button onclick="aaa()">파일 데이터 읽기</button>
    <textarea id="ta" cols="30" rows="10"></textarea>
    <script>
        function aaa(){
            //사용자가 선택한 파일의 데이터를 읽어오는 능력을 가진 FileReader 객체를 생성하여 읽어오기
            //보안상의 문제로.. 사용자가 선택한 파일만 읽을 수 있음..파일경로를 직접 개발자가 쓸 수 없음.
            //보안상의 문제로.. 사용자의 컴퓨터에 파일을 쓸 수 있는 기능은 제공되지 않음.

            //사용자가 선택한 파일정보 가져오기
            var f= document.getElementById('in1').value;
            //alert(f); //value로 취득한 경로는 실제 파일경로가 아님. 가짜경로. fakePath..

            //가짜경로로는 파일읽기 불가능.
            //사용자가 선택한 파일객체를 그대로 받아오기
            var files= document.getElementById('in1').files;//여러개 선택될 수 있어서 무조건 배열로 줌
            alert( files[0].name +"\n" + files[0].size + '\n' + files[0].type );

            // 실제 파일데이터를 읽어오기
            //1. 파일리더 객체 생성
            var fr= new FileReader();

            //3. 파일을 읽어오는 작업이 오래걸림..그래서 완료가 되면 자동으로 실행되는 함수를 등록
            // 읽기 요청보다 먼저 등록해야 함.
            fr.onload= function(){
                document.getElementById('ta').innerHTML= fr.result;//리더가 읽어들인 결과
            }

            //2. 파일리더에게 텍스트로 데이터를 읽어달라고 요청
            fr.readAsText( files[0], "utf-8" );
        }
    </script>

    <hr>
    <!-- 사용자가 선택한 이미지의 미리보기 구현... -->
    <h2>이미지파일 읽기 및 미리보기</h2>
    <input type="file" id="in2" multiple onchange="bbb()">
    <hr>
    <img src="" alt="" id="aa" style="border: 4px solid black; max-width: 400px; max-height: 400px;">
    <script>
        function bbb(){
            //사용자가 선택한 파일들 받기
            var files= document.getElementById('in2').files;
            //1. 파일리더 생성
            var fr= new FileReader();
            //2. 로딩완료되면 실행될 함수 등록
            fr.onload= function(){
                //alert(fr.result); //선택한 이미지의 URL경로
                document.getElementById('aa').src= fr.result;//선택한 이미지의 URL경로
            }
            //3. 파일 읽기요청...단, <img>요소에 보여줘야 하기에..파일경로(URL)형태로 읽어달라고 요청
            fr.readAsDataURL(files[0]) //첫번째 선택한 이미지 읽기
        }
    </script>



</body>
</html>
