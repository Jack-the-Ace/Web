<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05_Note</title>
    <style>
        *{padding: 0; margin: 0;}
        #wrap{
            width: 90%; margin: 0 auto;
            border: 4px solid black;
            font-size: 0px;
        }
        #wrap div{
            display: inline-block;
            height: 100px;
            font-size: 16px;
        }
        #wrap div:first-child{background-color: aqua;}
        #wrap div:nth-child(2){background-color: lightgreen;}
        #wrap div:nth-child(3){background-color: orange;}
        #wrap div:nth-child(4){background-color: indigo;}
        #wrap div:last-child{background-color: yellow;}
        @media all and (min-width:320px){
            #wrap div{width: 100%;}
        }
        @media all and (min-width:600px){
            #wrap div{width: 50%;}
            /* #wrap div:last-child{width: 100%;} */
        }
        @media all and (min-width:800px){
            #wrap div{width: 20%;}
            /* #wrap div:last-child{width: 20%;} */
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div>aa</div>
        <div>bb</div>
        <div>cc</div>
        <div>dd</div>
        <div>ee</div>
    </div>    
</body>
</html>
