<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부모 요소 사이즈에 대한 </title>

    <style>
        *{border: 1px dotted red;}
    </style>
</head>
<body>
    
    <!-- 부모 요소 box의 height은 언제나 자식 요소 box 높이를 감싸지 않음. -->

    <!-- 1. 블럭요소 안에 다른 블럭요소가 있다면 부모가 자식을 온전히(패딩,마진) 감쌈 -->
    <div style="border: 1px dotted blue;">
        <p style="margin: 10px; padding: 10px;">Hello</p>
    </div>

    <hr>

    <!-- 2. 블럭요소 안에 인라인요소가 있다면 부모가 자식을 온전히 감싸지 않음(마진,패딩 제외) -->
    <div style="background-color: khaki; border: 1px dotted blue;">
        <a href="" style="padding: 10px; margin: 10px;">naver</a>

        <input type="text" style="padding: 10px; margin: 10px;">
    </div>

</body>
</html>
