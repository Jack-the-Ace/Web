<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        ul{list-style: none;}
        nav{height: 50px; background-color: lightgreen;}
        nav ul.menu>li{display: inline-block; border: 1px solid blue;
            padding: 5px 10px; margin: 10px;}
        nav ul.submenu{border: 1px dotted red; border-radius: 10px; background-color: aqua; 
            display: none; position: absolute;}
        nav li.menu_item:hover .submenu{display: block;}
    </style>
</head>
<body>
    <nav>
        <ul class="menu">
            <li class="menu_item">
                HOME
                <ul class="submenu">
                    <li>111</li>
                    <li>111</li>
                    <li>111</li>
                </ul>
            </li>
            <li class="menu_item">
                SERVICE
                <ul class="submenu">
                    <li>222</li>
                    <li>222</li>
                    <li>222</li>
                </ul>
            </li>
            <li class="menu_item">
                CONTACT
                <ul class="submenu">
                    <li>333</li>
                    <li>333</li>
                    <li>333</li>
                </ul>
            </li>
        </ul>
    </nav>
</body>
</html>
