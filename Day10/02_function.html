<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>

    <!-- 내부 스크립트 작성 -->
    <script>
        // 1. 함수 정의 및 호출(선언적 함수라고 부름)
        function aaa(){
            document.write('aaa function<br>');
            document.write('Hello<br>');
        }
        
        aaa();  // 함수 호출
        aaa();

        // 특이한 점... 함수정의보다 호출이 먼저 있어도 됨. (why? JS는 script 영역의 코드를 실행하기전에 해당 영역의 '선언적함수'들을 먼저 읽어들여 인식함)
        bbb();

        function bbb(){
            document.write('bbb function..<br>');         

        }
        // 아래에 작성한 다른 script 영역의 함수를 호출해보기
            ccc();  //에러발생!!
            // 에러가 발생하면 사용자가 보는 body 영역에는 아무 표시가 없음.
            // 대신 브라우저의 [개발자도구 F12]의 'console' 탭에 에러내용이 표시됨.
            // 에러가 발생하는 그 script 영역은 더 이상 코드를 진행하지 않음
            document.write('첫번째 script영역 종료<hr>')
            // 단, 다른 스크립트는 별도로 이어서 실행됨.
    </script>

    <!-- 또 다른 스크립트 영역 -->
    <script>
        // 위 영역에 있던 선언적 함수를 호출할 수 있나?
        bbb();  //ok

        function ccc(){
            document.write('ccc function....<br>');
        }  
    </script>

    <!-- 2. 함수 파라미터에 값 전달하기 -->
    <script>
        document.write('<hr>');

        // 값 1개를 전달받는 함수 정의.
        function ddd(a){  // 주의! 파라미터(매개변수)를 만들때는 var 키워드가 있으면 안됨.
            document.write(a+'<br>');
        }

        // 함수 호출하면서 값 전달하기
        ddd(100);
        ddd('sam');
        ddd(new Date());
        //값을 전달하지 않으면???
        ddd(); //undefined
        document.write('<hr>');

        // 매개변수(파라미터) 2개짜리 함수
        function eee(a,b){
            document.write(a+','+b+'<br>');

            // 혹시 a와 b에 값이 전달되지 않으면.. 에러 안내문구.. 보여주고.. 덧셈연산을 하지 않도록.. 함수의 동작을 멈추기..
            if(a==undefined||b==undefined){
                document.write('2개의 수를 모두 전달해주세요.<br>');
                return;
            }

            // 전달받은 두 매개변수의 값들을 덧셈하여 결과 출력하기
            var c=a+b;
            document.write('결과: '+c+'<br>');
        }
        eee(50,30);
        eee(50);  // 50, undefined  -- 50 + undefined =  NaN (Not a Number)

        // 같은 이름의 함수를 또 정의하면.. 덮어쓰기됨(즉, 마지막 정의한 함수내용으로 덮어써짐.)
        // 위에서 먼저 호출했던 eee(50,30)문도... 영향 받음.
        function eee(){
            document.write('같은 이름을 또 써버린 eee function<br>');
        }
        eee();

    </script>

    <!-- 함수 실행 후 결과를 리턴받기 -->
    <script>
        document.write('<hr>');

        function ggg(){
            // return 1000;  //ggg()함수를 호출한 위치로 100이라는 값을 가지고 돌아가기
            //return 'sam';
            //return true;
            //return 5>3;
            //return 5+3;
            return new Date();
        }

        var n= ggg();  // ggg함수의 코드가 실행되고.. 그 return된 값이 이 자리를 대체함.
        document.write(n+'<br>');
        document.write('<br>');

        // 여러개의 값을 한번에 리턴할 수는 없음.
        function hhh(){
            // return 10,20,30;  //여러개의 값 중 마지막 값 1개만 리턴됨.
            // 여러개의 값을 리턴하려면.. 배열로 묶어서 리턴해야 함.
            return [10,20,30];
        }

        var m=hhh();
        document.write(m+'<br>');
        document.write(m[0]+'<br>');
    </script>

    <!-- 함수의 매개변수 기본값 -->
    <script>
        document.write('<hr>');

        function sss(a=5){  //parameter default value
            document.write(a+'<br>');
        }
        sss(10000);
        sss();

        function ttt(a=1, b=2){
            document.write(a+','+b+'<br>');
        }
        ttt(10,20);
        ttt(100);
        ttt();
        // 파이썬과 다른 점. 값을 전달할 때 파라미터명을 지정할 수 없음. [순서변경 안됨]
        ttt(b=1000, a=50);  // 그냥 파라미터 순서대로 전달됨.
    </script>

    <!-- 내장된 arguments 배열변수(거의 사용 안함. --선호하지 않음.) -->
    <script>
        document.write('<hr>');

        // arguments 배열 : 매개변수를 자동으로 저장하는 내장된 배열변수
        function add(){
            document.write('전달된 값의 개수: '+arguments.length+'<br>');
            // 전달된 각 값들은.. 반복문으로 arguments 의 요소들의 접근...
            for(var n=0; n<arguments.length; n++){
                document.write(arguments[n]+',');
            }
            document.write('<br>');
        }

        add();
        add(10);
        add(10,20);
    </script>

    <!-- 지역변수와 전역변수 -->

    <script>
        document.write('<hr>');

        // 지역변수 : 함수 안에서 var 키워드로 만든 변수
        // 전역변수 : 함수 밖에서 var 키워드도 만들거나 함수 안에서 var키워드 없이 만든 변수

        // 지역변수는 변수를 만든 그 함수 영역(지역)안에서만 인식되는 변수
        // 전역변수는 이 스크립트 안에 어디서든 인식 가능한 변수

        var name='sam';  //전역변수
        function mmm(){
            var num=10;  //지역변수
            document.write('함수 안 지역변수 num: '+num+'<br>');
            document.write('함수 안 전역변수 name: '+name+'<br>');
            // 함수 안에서 전역변수를 만들고 싶다면... var 키워드 없이 그냥 변수만들고 사용
            address='seoul';  //전역변수 (권장하지 않음.)
            document.write('함수 안 전역변수 address: '+address+'<br>');
        }
        mmm();
        // document.write('함수 밖 지역변수 num: '+num+"<br>");  // error
        document.write('함수 밖 전역변수 name: '+name+'<br>');  // OK
        document.write('함수 밖 전역변수 address: '+address+'<br>'); //OK
        document.write('<br>');

        // 지역변수에서,,, 지역이라는 의미는 함수의 {} 영역을 의미함.
        // 그래서 다른 {}영역은 지역으로 인식하지 않음.
        if(true){
            var tel='010-1234-5678'; //지역변수 아님!!!
            document.write('조건문 안 tel: '+tel+'<br>');
        }
        document.write('조건문 밖 tel: '+tel+'<br>');

        // Javascript의 버전 ECMAScript6 버전에서... (별도 수업 예정!)
        // 새로 등장한 변수 생성 키워드 let, const는... {}는 모두 지역으로 인식함.

    </script>

    <!-- 이름이 없는 함수 : 익명함수 -->
    <script>
        document.write('<hr>');

        // show();  // error -- 익명함수는 선언적 함수가 아니어서 먼저읽지않음, 그렇기에 함수 정의보다 호출이 먼저 있으면 에러!

        // 익명함수는 반드시 선언하면서 변수에 넣어야 함.
        var show=function(){
            document.write('익명함수<br>');
        }
        document.write(show+'<br>');  // show 변수가 저장하고 있는 함수코드가 출력됨
        // 변수의 이름을 함수이름처럼 호출할 수 있음.
        show();
        show();
    </script>

    <!-- 함수를 변수에 대입할 수 있기에.. 다른 변수에도 함수코드를 넘겨줄 수 있음. -->
    <script>
        document.write('<hr>');

        var sss=function(){
            document.write('sss function...<br>');
        }

        var ttt=sss;  // sss변수가 가진 함수코드를 ttt변수가 대입받아 저장
        // ttt는 함수코드를 가지고 있으니.. 변수명을 마치.. 함수 이름처럼 사용하여 호출가능
        ttt();

        // 일반 변수말고... 다른함수의 매개변수(파라미터)에 sss함수코드를 전달할 수도 있음.
        function www(f){
            // f 가 함수를 가지고 있으니.. 함수명처럼 호출 가능
            f();

        }
        www(sss)  // www함수를 호출하면서 sss가 가진 함수코드를 전달... 하면.. f라는 매개변수가 받음.
        // 같은 함수를 호출하면서 다른 함수를 전달할 수도 있겠네요..
        www(function(){
            document.write('내것도 실행해줘..<br>');
        })

        // 같은 기능함수 www를 호출하면서.. 서로 다르게 동작하도록 기능함수를 다르게 전달하는 형태
        // GUI에서 커튼 클릭시 다른 동작이 수행되도록 할 때 매우 많이 활용되는 기법
        // 이렇게 다른 함수를 파라미터로 받아 대신 실행해주는 함수를 '고차함수'라고 부름

    </script>
