<!-- 1차원 레이아웃은 flex, 2차원 레이아웃 구조는 grid -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        .container{
            /* 자식요소들의 배치를 격자모양으로.... */
            display: grid;
            border: 2px solid black;

            /* 자식요소들을 한 줄에 몇개씩 놓을지 결정 (방법. 각 칸(column)들의 너비를 지정) */
            grid-template-columns: 100px 150px 200px;
            /* 모든 요소의 너비를 자동으로 같게... */
            grid-template-columns: auto auto auto;
            /* 비율로 너비를 지정하는 단위(fr:fraction) */
            grid-template-columns: 1fr 2fr 1fr; /* 1:2:1 의 너비 비율 */
            grid-template-columns: 1fr 1fr 1fr; /* 1:1:1 의 너비 비율 */

            /* 줄 높이를 지정하기 */
            grid-template-rows: 150px 200px;

            /* 격자 사이의 간격지정 가능 */
            column-gap: 1rem;  /* rem : root em 단위 : 최상위요소의 글자크기를 기준으로.. */
            row-gap: .5rem;

            /* 축약 */
            gap: .5rem 1rem;  /* row colomn */
        }
        .container>div{
            background-color: aqua;
            margin: 4px;
            text-align: center;
            padding: 8px;
        }
    </style>

</head>
<body>
    <div class="container">
        <div id="c1">1</div>
        <div id="c2">2</div>
        <div id="c3">3</div>
        <div id="c4">4</div>
        <div id="c5">5</div>
        <div id="c6">6</div>
        <div id="c7">7</div>
    </div>
    <style>
        /* 자식요소의 셀 위치지정 및 셀병합 */
        #c1{
            grid-column-start: 1;
            grid-column-end: 3;
            /* 1~2칸 */
        }
        #c3{
            grid-column-start: 2;
            grid-column-end: 4;
            /* 2~4칸 */
        }
        #c5{
            grid-column: 3 / span 2;  /* 3번 위치부터 2칸 [4번째 칸이 없으면 생성] */
        }

        /* 특정 row 위치 및 병합 */
        #c6{
            grid-row-start: 2;
            grid-row-end: 5;
            /* 2~4번줄까지.. */
        }
    </style>
</body>
</html>
