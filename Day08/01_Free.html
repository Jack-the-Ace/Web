<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>01_Free_Note</title>
        <style>
            #container>div{
                border: 2px dotted blue;
                background-color: aquamarine;
                margin: 10px;
                padding: 20px;
                /* height: 100px; */
            }
            #container{
                display: flex;
                flex-direction: row;
                flex-wrap: wrap-reverse;
                flex-flow: column wrap;
                flex-flow: row nowrap;

                flex-direction: row;
                justify-content: flex-start;
                justify-content: center;
                justify-content: flex-end;
                justify-content: space-between;
                justify-content: space-around;
                justify-content: space-evenly;

                flex-direction: column;
                justify-content: flex-end;
                justify-content: space-between;
                justify-content: space-evenly;

                justify-content: flex-start;
                flex-direction: row;
                align-items: flex-end;
                align-items: center;
                align-items: stretch;
                align-items: baseline;

                flex-direction: column;
                align-items: center;
                /* align-items: stretch; */
                height: 200px; border: 2px solid black;                
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div>aa</div>
            <div style="font-size: 30px;">bb</div>
            <div>cc</div>
        </div>
        <hr>
        <div id="header">
            <h2>Hello</h2>
            <p>This is Flex Style</p>
        </div>
        <div style="background-color: rgb(104, 72, 30); color: white;">x</div>
        <style>
            #header{
                background-color: blueviolet;
                color: lavender; height: 200px;
                display: flex;
                flex-direction: column;
                justify-content: center; align-items: center;
            }
        </style>
        <hr>
        <div id="container2">
            <div id="c1">aaa</div>
            <div id="c2">bbb</div>
            <div id="c3">ccc</div>
        </div>
        <style>
            #container2>div{
                background-color: chocolate;
                padding: 20px; border: 2px solid red; margin: 10px;
            }
            #container2{
                background-color: bisque;
                border: 2px solid blue;
                display: flex;
            }
            /* #c1{order: 1; flex-grow: 3;} 
            #c2{order: 1; flex-grow: 3; flex-basis: 200px;} 
            #c3{order: 1; flex-grow: 3; flex-basis: 400px;} */
            #c1{flex: 1;}  #c2{flex: 9;}  #c3{flex: 1;}
            #container2>div{
                flex-direction: column;
                height: 210px;
            }
            #container2{height: 400px;}
            #c1{align-self:center;}  #c2{align-self:flex-end;}
        </style>
        <hr>
        <div style="background-color: aliceblue;">|</div>
    </body>
</html>
