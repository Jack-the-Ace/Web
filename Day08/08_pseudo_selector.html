<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- 1. has() : 특정 요소를 가지고 있는 요소를 선택 -->
    <div>
        <p>Hello World</p>
    </div>
    <div>
        <a href="">link</a>
    </div>
    <style>
        div:has(a){background-color: lightblue;}
    </style>

    <hr>

    <!-- 예) 메뉴 항목 위로 마우스 커서를 올렸을때 해당 메뉴가 잘 보여지도록 나머지 요소들을 반투명하게... -->
    <nav>
        <ul>
            <li><a href="">HOME</a></li>
            <li><a href="">ABOUT</a></li>
            <li><a href="">PORTFOLIO</a></li>
            <li><a href="">CONTACT</a></li>
        </ul>
    </nav>
    <style>
        nav ul{
            background-color: black; display: flex;
            list-style: none; flex-direction: row; justify-content: space-evenly;
            padding: 1rem;
        }
        nav ul li a{
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        nav ul li a:hover{color: orange;}
        nav:has(a:hover) a:not(a:hover){opacity: 0.4;}
    </style>

</body>
</html>
