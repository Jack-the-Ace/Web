<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        #wrap{
            display: grid;
            grid-template-columns: auto auto auto auto auto;
            grid-template-rows: auto 300px auto;
        }
        #wrap>div{
            background-color: aquamarine;
            text-align: center;
            padding: 20px 0px;
            font-size: 30px;
            border: 1px solid black;
        }
        #header{grid-column-start: 1; grid-column-end: 6;}
        #main{grid-column-start: 2; grid-column-end: 5;}
        #footer{grid-column: 1/span 5;}
    </style>


</head>
<body>

    <div id="wrap">
        <div id="header">Header</div>
        <div id="nav">Menu</div>
        <div id="main">Content</div>
        <div id="aside">Side</div>
        <div id="footer">Footer</div>
    </div>
    
</body>
</html>
