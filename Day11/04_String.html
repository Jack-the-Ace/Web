<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String object</title>

    <script>
        // 3. String 생성자 함수 - 문자열 처리에 관련된 여러 기능들 설계도
        // 기초타입 string과 구별
        var a='sam';
        var b=new String('sam');  //string의 Wrapping 임...

        document.write(typeof(a),'<br>');
        document.write(typeof(b),'<br>');
        document.write((a===b),'<hr>');

        // string의 유용한 변수와 기능들(function-함수-메소드)
        var s='Hello world';  //자동 String객체로 wrapping...

        // 1) 글자수를 가지고 있는 멤버변수(속성)
        document.write(s.length+'<br>');

        // 2) 대소문자 변환기능
        document.write(s.toUpperCase(),'<br>');
        document.write(s.toLowerCase(),'<br>');
        document.write(s+'<br>');  //원본은 그대로..

        // 3) 글씨 결합하기
        document.write(s.concat('Nice')+'<br>');
        document.write(s+'<br>');  //원본은 그대로..
        // 문자열의 결합은 매우 많이 사용하지만. concat()은 많이 안씀...
        // 문자열의 +결합연산자를 더 많이 사용함.
        document.write(s+'Nice'+'<br>');

        // 4) 특정 문자가 있는 위치번호(index번호 0,1,2,3,~) 얻어오기
        document.write(s.indexOf('world'),'<br>');  //해당 문자의 첫 글자 자리번호
        document.write(s.indexOf('sss'),'<br>');  //못찾으면 -1
        //검색할때 대소문자 구별??
        document.write(s.indexOf('worlD'),'<br>'); // -1
        

        // 5) 문자열 안에 원하는 문자를 검색하여 추출 (문자탐색... match)
        var str='Hello world! Nice to meet you. 안녕하세요, 반갑합니다. Nice work! nice study.'
        
        var word=str.match('Hello');
        document.write('검색글자: ',word,'<br>');

        var word=str.match('Good');  //못찾으면 null
        document.write('검색글자: ',word,'<br>');

        // 대소문자 구별?
        var word=str.match('hello');  //null
        document.write('검색글자: ',word,'<br>');

        //대소문자 구별없이 검색하고 싶다면.. 민감하게 검색하지 않도록 옵션.. (i : insensitive)
        document.write(str.match(/hello/i),'<br>');  //슬래쉬로 문자열을 쓰는 방식 --추후 수업예정

        //여러개의 같은 문자가 있을떄 찾아지는지...
        var words=str.match(/Nice/);
        document.write('탐색된 글자들 : ',words,'<br>');

        // 여러개를 찾고 싶다면... 전체에서 검색하도록.. 옵션 주기.. global
        var words=str.match(/Nice/g);
        document.write('탐색된 글자들 : ',words,'<br>');

        //대소문자 구별없이 모든 같은 문자들 탐색하려면... 옵션 2개 모두 사용
        var words=str.match(/Nice/ig);
        document.write('탐색된 글자들 : ',words,'<br>');
        document.write('<hr>');

        // 6) 문자 바꿔치기... replace
        var s='Hello world';
        document.write(s.replace('world','web'),'<br>');  //원본은 그대로..
        document.write(s.replace('nice','web'),'<br>');  //없는 글자를 바꾸려하면 그냥 원본 그대로..

        document.write(s.replace('worlD','web'),'<br>');  // 안바뀜
        document.write(s.replace(/worlD/i,'web'),'<br>');  //바뀜

        // 여러개의 단어를 동시에 모두 바꾸려면...
        var str='hello world. nice world. good world. bad world';
        document.write(str.replace('world','AI'),'<br>');
        document.write(str.replace(/world/gi,'AI'),'<br>');

        // 문자열 사이 사이에 있는 모든 공백문자를 없앨때도 활용이 가능함.
        var result=str.replace(/ /g,'');  //공백문자를 빈문자열로 바꾸기..
        document.write(result,'<hr>');

        // 7) 문자열을 특정 문자 기준으로 잘라서 배열로 리턴해주는 기능(csv파일 분석에 많이 활용)
        var s="one,two,three,four,five";
        var aaa=s.split(',');  // , 를 기준으로 자르기..
        document.write('요소의 개수: ',aaa.length,'<br>');

        document.write(aaa[0],'<br>');
        document.write(aaa[1],'<br>');
        document.write(aaa[2],'<br>');
        document.write(aaa[3],'<br>');
        document.write(aaa[4],'<br>');




    </script>
</head>
<body>
    
</body>
</html>
