<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date object</title>

    <script>
        // JS에 내장된 유용한 생성자 함수들 [ Date, Number, String, Math, Array ]
        // new 키워드를 객체를 생성하여 사용.

        //1. Date: 날짜와 시간에 관련된.. 기능 및 변수를 설계
        var a=new Date();
        document.write(a+'<br>'); //참조변수를 출력하면그 객체의 정보를 출력해줌
        document.write(typeof(a)+'<br>');  // 모든 객체의 자료형은 object

        // 주요 기능들(멤버함수--메소드)
        document.write(a.toDateString()+'<br>');
        document.write(a.toLocaleString()+'<br>');
        document.write(a.getMonth()+'<br>'); // 0~11월
        document.write(a.getFullYear()+'<br>');
        document.write(a.getYear()+'<br>');
        document.write(a.getDate()+'<br>');
        document.write(a.getHours()+'<br>');
        document.write(a.getMinutes()+'<br>');
        document.write(a.getSeconds()+'<br>');
        document.write(a.getTime()+'<br>');  //1970.01.01 09:00 부터 ms마다 카운트를 센 값 - timestemp
        // 경과시간 등을 계산할때 사용 [종료시간 - 시작시간]

        // Date 객체가 생성될때의 시간으로 설정됨..
        // 이를 변경할 수도 있음.
        var b=new Date();
        document.write(b.toLocaleString()+'<br>');
        b.setFullYear(2027);
        document.write(b.toLocaleString()+'<br>');

        //객체를 생성할때 시간을 설정할 수도 있음.
        var c=new Date(2026,7,12);  //2026년 8월 12일 [달 쓸때 조심..!!]
        document.write(c.toLocaleString()+'<br>');

        c=new Date('2026. 7. 14'); 
        document.write(c.toLocaleString()+'<br>'); //2026년 7월 14일

        c=new Date('Wed Jun 10 2026');
        document.write(c.toLocaleString()+'<br>');

        c=new Date('Wed 10 Jun 2026 13:40:13 GMT+0900');
        document.write(c.toLocaleString()+'<br>');

        c=new Date(10000);  // 1970.01.01  09:00 기준... ms 카운트 시간
        document.write(c.toLocaleString()+'<br>');
        document.write('<hr>');

        // 두 날짜 사이의 비교
        var a=new Date('2026.4.29'); //개강일
        var b=new Date();  //오늘

        var diff=b.getTime() - a.getTime();  //두 날짜의 밀리초 차이
        var diff=b-a;  // 자동으로 getTime()으로 차이를 구함.

        // 밀리초를 날짜 수로 변경
        var sec=diff/1000; // ms --> s
        var min=sec/60;    // s  --> m
        var hour=min/60;   // m  --> h
        var day=hour/24;   // h  --> day
        
        document.write('두 날짜의 일수 차이: ',day,'일<br>');
        // 수학기능 중 소수점을 날리는 기능 - 파이썬에도 있었음.
        day=Math.floor(day);
        document.write('두 날짜의 일수 차이: ',day,'일<br>');

        //[기준일 입력완료] 버튼을 클릭했을때 수행할 작업코드를 작성한 영역(함수)
        function aaa(){
            // in1 요소에 선택된 날짜 값 얻어오기
            var in1=document.getElementById('in1');
            var v=in1.value;
            document.write(v,'<br>');

            var a=new Date(v); //위에서 선택한 날짜로 Date객체를 생성
            var b=new Date();

            var diff=b-a;
            day=diff/(1000*60*60*24);
            day=Math.floor(day); //소수점 제거

            if(day>0){
                document.write(`오늘로부터 ${day}일 전<br>`);
            }else if(day<0){
                document.write(`오늘로부터 ${-day}일 후<br>`);
            }else{
                document.write(`오늘<br>`);
            }
        }


        // 현재시간 표시 기능
        function bbb(){
            var d=new Date();  //현재시간
            var h4=document.getElementById('hh');
            h4.innerHTML=d.toLocaleString();

            // 1초마다 bbb()함수가 다시 실행되도록... 행운의 편지..
            setTimeout('bbb()',1000);  //1000ms 후에 bbb함수를 다시 실행해!!
        }

    </script>
</head>
<body>
    <hr>
    <h2>경과시간 계산기</h2>

    <input type="date" id="in1">
    <button onclick="aaa()">기준일 입력완료</button>

    <hr>
    <h2>현재 시간 표시</h2>
    <button onclick="bbb()">Show Clock</button>
    <h4 id="hh">00:00:00</h4>

    
</body>
</html>
